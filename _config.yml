# ---------------------------
# Hexo Theme Solitude·改
# 原作者: 伍十七(@everfu)
# 原项目: https://github.com/everfu/hexo-theme-solitude
# 维护者: Ryoine(@Qiu-Quanzhi)
# 项目地址: https://github.com/Qiu-Quanzhi/hexo-theme-solitude-kai
# ---------------------------

# --------------------------- 开始 ---------------------------
# 网站信息
site:
  name:
    class: text # text / iconClass / img
    custom: Solitude-Kai # 文本 / 图标类名 / 图片路径
  icon: /img/logo.png # 网站图标
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# 导航栏
nav:
  # 左侧按钮
  group:
  #  project: # 组名
  #    Solitude-Kai: https://github.com/Qiu-Quanzhi/hexo-theme-solitude-kai || /img/logo.png # 子项名: 路径 || 图标类名

  # 菜单
  menu:
    # 首页: / || fas fa-house-chimney # 项名: 路径 || 图标类名
    # 文库: # 项名
    #   文章合集: /archives/ || fas fa-folder-closed # 子项名: 路径 || 图标类名
    #   分类合集: /categories/ || fas fa-clone
    #   标签合集: /tags/ || fas fa-tags
    # 友链: /links/ || fas fa-user-group
    # 关于: /about/ || fas fa-image-portrait
    # 装备: /kit/ || fas fa-laptop

  # 右侧按钮
  right:
    custom:
    #  - name: Time.is # 名字
    #    url: https://time.is/ # 路径
    #    icon: fas fa-clock # 图标
    #    onclick: # 点击事件
    #    id: timeis_button # id
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# 侧边栏
aside:
  # 侧边栏配置

  # 值: about(信息卡), newestPost(最新文章), allInfo(网站信息)
  # Sticky: 固定位置 / noSticky: 不固定位置
  
  home: # 首页
    noSticky: "about"
    Sticky: "allInfo"
  post: # 文章页
    noSticky: "about"
    Sticky: "newestPost"
  page: # 普通页
    noSticky: "about"
    Sticky: "newestPost,allInfo"
  # 菜单栏位置 (0: 左 1: 右)
  position: 1
  
  
  # 个人信息卡
  my_card:
    # 头像
    author:
      img: /img/logo.png # 图片路径
      url: /about/ # 点击头像跳转路径 ????????
    # 时段状态
    state:
      morning: ✨ 早上好，新的一天开始了
      noon: 🍃 午休时间
      afternoon: 🌞 下午好
      night: 🌙 晚上好，早点休息
      goodnight: 🔮 晚安
    # 交互语录
    witty_words: ????????????????????????????????????????????????????????????????????????
      # - 你可以的
      # - 你一定可以的
      # - 祝你好运，陌生人
    # 更多链接
    information:
    #  Github: https://github.com/Qiu-Quanzhi || fab fa-github # 项名: 路径 || 图标类名
    #  Bilibili: https://space.bilibili.com/1036651852 || fab fa-bilibili
  


  # 文章目录
  toc:
    post: true
    page: false
    vague: true
  


  # 标签
  tags:
    enable: false
    limit: 20 # 标签展示数量
    # 推荐标签
    highlight_list:
      # - 示例标签
  


  # 归档
  archive:
    enable: true
    type: "year" # month / year
  


  # 网站信息
  siteinfo:
    # 文章数量
    postcount: false
    # 总字数
    wordcount: true
    # 最后更新日期
    updatetime: true
    # 网站创建时间
    runtimeenable: true
    # 建站时间
    runtime: "2023-06-30 00:00:00" # yyyy-MM-dd hh-mm-ss
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# 页面默认设置
page:
  # 404 页面
  error: true
  # 标签页面
  tags: true
  # 分类页面
  categories: true
  # 0: 排序列表 / 1: 跟随首页列表
  archives: 0
  # 默认值
  default:
    # 未设置封面时的默认图片
    cover:
      # - /img/default.png # 图片路径
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# 文章设置
post:
  # 文章默认设置
  default:
    # 默认封面图片
    cover:
      # - /img/default.avif # 图片路径
    # 默认位置
    locate: 地球
    # 默认版权
    copyright:
      enable: true
      author:
        url: /about/
        # 默认使用 site.icon
        img:
      # 许可证
      license: CC BY-NC-ND 4.0
      # 许可证链接
      licenseUrl: https://creativecommons.org/licenses/by-nc-nd/4.0/deed.zh-hans

  # 文章元信息
  meta:
    # 发布日期
    date: true
    # 更新日期
    updated: true
    # 位置
    locate: true
    # 字数
    wordcount: true
  

  
  # 订阅源
  rss: # /atom.xml
  # 文章封面取色
  covercolor:
    enable: false
    # local: 本地取色 / api: API 取色 / ave: OSS 服务取色
    mode: local
    # API 地址
    api: 
    # 缓存时间
    time: 43200000
  


  #页脚
  footer:
    enable: false
    desc: # 文章来自 Ryoine
    button:
      enable: true
      name: # 了解更多
      url: /about/
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# 主题色
theme_color:
  dark: "#66ccff" # 深色模式
  light: "#66ccff" # 浅色模式
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# 显示模式
display_mode:
  # auto: 自动切换（识别设备当前主题模式） / dark: 深色模式 / light: 浅色模式
  type: auto
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# 字体设定
font:
  # 全局字体
  font-size: 16px
  font-family: "PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif"
  # 代码字体
  code-font-size: 16px
  code-font-family: 'ui-monospace,SFMono-Regular,"SF Mono",Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace'
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# Home page article configuration information
# 首页文章配置信息
index_post_list:
  direction: row # row / column ############################################################################
  cover: both
  content: 2
  length: 200
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# Mermaid
mermaid: false
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# Chart.js
chart: false
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# 控制台
console:
  enable: false
  card:
    # Tags
    # 标签
    tags: true
    # Archives
    # 归档
    archive: "year"
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# 页脚
footer:
  # 社交图标栏
  information:
    author: false # 图片路径 / false
    left:
      # Github: https://github.com/Qiu-Quanzhi || fab fa-github # 项名: 路径 || 图标类名
      # Mail: mailto:i@qqzhi.cc || far fa-envelope
    right:
      # Bilibili: https://space.bilibili.com/ || fab fa-bilibili
      # Douyin: https://v.douyin.com/ || fab fa-tiktok
  


  # 页脚链接栏
  group:
    # 本站:
    #   版权声明: /copyright/
    #   个人主页: https://www.qqzhi.cc/
    #   本站概览: javascript:sco.showConsole()
    # 文库:
    #   文章合集: /archives/
    #   分类合集: /categories/
    #   标签合集: /tags/



  # 随机友链
  randomlink: false

  # 备案
  beian:
    # - name: 湘公网安备43048102000175号
    #   icon: https://beian.mps.gov.cn/img/logo01.dd7ff50e.png
    #   url: https://beian.mps.gov.cn/#/query/webSearch
    # - name: 湘ICP备2024080357号-1
    #   url: https://beian.miit.gov.cn/

  # 页脚信息文字
  links:
    # - name: 友链与鸣谢
    #   url: /links/
    # - name: 订阅
    #   url: /atom.xml
    # - name: 版权声明
    #   url: /copyright/
    #   icon:
    #     - fab fa-creative-commons
    #     - fab fa-creative-commons-by
    #     - fab fa-creative-commons-nc
    #     - fab fa-creative-commons-nd
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# 404 页面
errorpage:
  img: /img/404.avif
  text: =awa= 页面走丢啦
  recommendList: false
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# 懒加载
lazyload:
  enable: true
  # 启用范围: post / site
  field: site
  # 加载时占位图
  placeholder: ""
  # 加载失败占位图
  errorimg: /img/error_load.avif
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# 加载
loading:
  # 全屏加载
  fullpage: false
  # 加载图标，不写默认siteicon
  favicon: /img/favicon.png
  # Pace 加载
  pace: true
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# 代码块高亮
highlight:
  enable: true
  # 当超过多少字时显示折叠按钮
  limit: 200
  # 是否启用复制按钮
  copy: true
  # 是否默认展开
  expand: true
  # 主题: default: 默认 / mac : 苹果终端
  theme: default
  # 颜色方案: default / solidity / dracula
  color: default
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# OpenGraph
OpenGraph:
  enable: true
  options:
    # twitter_card:
    # twitter_image:
    # twitter_id:
    # twitter_site:
    # fb_admins:
    # fb_app_id:
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# 字数统计
# 警告: 请先安装 hexo-wordcount 插件。
wordcount: false
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# Katex
# Latex 公式支持
katex:
  enable: true
  # 是否在每个页面加载
  per_page: false
  # 是否启用复制公式
  copytex: true
# --------------------------- 结束 ---------------------------



# --------------------------- 开始 ---------------------------
# 扩展
extends:
  # 插入到 head
  head:
  #  - <script src="https://cdn.bootcdn.net/ajax/libs/pace/1.2.4/pace.min.js"></script>

  # 插入到 body
  body:
  #  - <script src="https://cdn.bootcdn.net/ajax/libs/pace/1.2.4/pace.min.js"></script>
# --------------------------- 结束 ---------------------------

# --------------------------- 开始 ---------------------------
# 即刻短文
logs:
  enable: false
  home_mini: false
  page: /logs/
  style: 1
  strip: 30
# --------------------------- 结束 ---------------------------


# --------------------------- 开始 ---------------------------
# CDN配置
CDN:
  # CDN提供商配置
  internal: local # local / cdnjs / jsdelivr / unpkg / custom
  third_party: custom # cdnjs / jsdelivr / unpkg / custom
  # 是否使用版本号
  version: true
  # CDN 自定义链接格式
  custom_format: https://cdn.jsdelivr.net/npm/${name}@${version}/${min_file}
  # 直接覆盖默认 CDN 链接（优先级最高）
  options:
    # chart_js:
    # color_thief:
    # fontawesome:
    # katex:
    # katex_copytex:
    # lazyload:
    # mermaid_js:
    # pace_js:
    # pjax:
    # snackbar:
    # swiper_css:
    # swiper_js:
# --------------------------- 结束 ---------------------------
